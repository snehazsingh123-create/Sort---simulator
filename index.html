<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sorting Visualizer By Rachit Prakash</title>
    <link rel="stylesheet" href="./css/style.css">

</head>

<body>

    <header>
        <nav>
            <div class="array-inputs">
                <button class="gnarray" id="a_generate">Generate New Array!</button>
                <p class="sizearr">Set array size:</p>
                <input class="inp" id="a_size" type="range" min=20 max=150 step=1 value=1>
                <p class="sizearr">Set speed of algorithm:</p>
                <input class="inp" id="a_speed" type="range" min=1 max=5 step=1 value=4>
            </div>
            <div class="algos">
                <button class="btns bl">Bubble</button>
                <button class="btns sl">Selection</button>
                <button class="btns in">Insertion</button>
                <button class="btns mr">Merge</button>
                <button class="btns qu">Quick</button>
            </div>
        </nav>
    </header>

    <section>

        <div id="Info_Cont1">

            <h3>TIME COMPLEXITY</h3>

            <div class="Complexity_Containers" id="Time_Complexity_Types_Container">

                <div class="Pair_Definitions">
                    <p class="Sub_Heading">Worst case:</p>
                    <p id="Time_Worst"></p>
                </div>

                <div class="Pair_Definitions">
                    <p class="Sub_Heading">Average case:</p>
                    <p id="Time_Average"></p>
                </div>

                <div class="Pair_Definitions">
                    <p class="Sub_Heading">Best case:</p>
                    <p id="Time_Best"></p>
                </div>

            </div>

        </div>

        <div id="array_container">
        </div>

        <div id="Info_Cont2">

            <h3>SPACE COMPLEXITY</h3>

            <div class="Complexity_Containers" id="Space_Complexity_Types_Container">

                <div class="Pair_Definitions">
                    <p class="Sub_Heading">Worst case:</p>
                    <p id="Space_Worst"></p>
                </div>

            </div>

        </div>

    </section>

    <footer>

    </footer>

    <script src="./scripts/main.js"></script>
    <script src="./scripts/visualizations.js"></script>

    <script src="./scripts/bubble_sort.js"></script>
    <script src="./scripts/selection_sort.js"></script>
    <script src="./scripts/insertion_sort.js"></script>
    <script src="./scripts/merge_sort.js"></script>
    <script src="./scripts/quick_sort.js"></script>
    <script src="./scripts/heap_sort.js"></script>
</body>

</html>
